
on: 
  workflow_call:
    inputs:
      username:
        description: 'A username passed from the caller workflow'
        default: 'john-doe'
        required: false
        type: string
    secrets:
      haselko:
        required: true
    outputs:
      result:
        value: "${{ jobs.result-job.outputs.outcome }}"
        
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  first-job:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!
  second-job:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
      - name: Print the input name to STDOUT
        run: echo The username is ${{ inputs.username }}
  third-job:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    needs: [first-job,second-job]
    steps:
      - uses: wtfjoke/setup-groovy@v3
        with:
          groovy-version: "4.x"
      - run: groovy --version
      - run: echo "${{ toJson(github) }}"
      - run: |
          echo ${{ toJson(github.ref) }},
          echo ${{ toJson(github.workflow)}} 
          echo ${{ secrets.haselko }} 
  result-job:
    # ustawia wynik ktory zostanie przekazany do workflow wywolujacy ten workflow
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.set-result.outputs.step-result }}
    steps:
      - name: set result output
        id: set-result
        run: echo "::set-output name=step-result::success"
