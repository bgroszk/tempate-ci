
on: 
  workflow_call:
    inputs:
      username:
        description: 'A username passed from the caller workflow'
        default: 'john-doe'
        required: false
        type: string
    secrets:
      haselko:
        required: true
    outputs:
      result:
        value: "${{ jobs.result-job.outputs.outcome }}"
        
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  first-job:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4 # poniewaz ten workflow jest wywolywany przez inny to ta akcja klonuje repo z workflow ktory wykonuje ten workflow_call
      # clonowanie innego repo 
      - uses: actions/checkout@v4
        with:
          repository: bgroszk/tempate-ci
          path: tempate-ci
          #token: ${{ secrets.GITHUB_TOKEN }}
      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!
      - name: co klonuje actions/checkout@v4
        run: |
          ls -la
          cd tempate-ci
          ls -la
  second-job:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    services:
      serverTomcat:
        image: nginx
        env:
          DUPA: dupa
        ports: 
          - 81:80
    steps:
      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        uses: bgroszk/tempate-ci/.github/actions/first/action@main
      - name: Print the input name to STDOUT
        run: echo The username is ${{ inputs.username }}
  third-job:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    needs: [first-job,second-job]
    steps:
      - uses: wtfjoke/setup-groovy@v3
        with:
          groovy-version: "4.x"
      - run: groovy --version
      - run: echo "${{ toJson(github) }}"
      - run: |
          echo ${{ toJson(github.ref) }},
          echo ${{ toJson(github.workflow)}} 
          echo ${{ secrets.haselko }} 
      - run: groovy -e '
            def name = System.getenv("GITHUB_ACTOR")
            println "Hello ${name}"
          '
  result-job:
    # ustawia wynik ktory zostanie przekazany do workflow wywolujacy ten workflow
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.set-result.outputs.step-result }}
    steps:
      - name: set result output
        id: set-result
        run: echo "::set-output name=step-result::DupaJasiu"
  docker-job:
    # wszystkie taski w ramch tego joba beda uruchoomione w kontenerze
    runs-on: ubuntu-latest
    container:
      image: centos:centos7.9.2009
    services:
      serverTomcat:
        image: nginx
        env:
          DUPA: dupa
        ports: 
          - 81:80
    steps:
      - name: check run in container
        run: |
          cat /etc/centos-release
          curl http://serverTomcat:80
          # curl http://127.0.0.1:81 nie dziala jakty nie wystawial na porcie 81 w kontenrze ale dziala w hoscie runnera - second-job
